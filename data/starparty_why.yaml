# What sets an AstroZane star party apart. Shown on the star party pages via {{< starparty-why >}}.
# Edit here and every page that uses the shortcode updates.
# Each group is one list. A group with a "lead" prints that line above its list.
- items:
    - title: "No screens near the telescope."
      text: "You look through the eyepiece with your own eye. There is no camera on the telescope and no laptop or monitor glowing beside it, and the only light I use is dim red. Your eyes stay adapted to the dark, so you see more as the night goes on."
    - title: "Night vision, on a telescope built for it."
      text: "Few star party hosts have a night vision device at all. My [14.7\" telescope](/projects/147-inch-f29/) is an f/2.9, fast enough to get the most out of one, so nebulae that are faint or invisible in an ordinary eyepiece show up live. [How night vision works](/astronomy/night-vision/)."
    - title: "A big telescope you sit down at."
      text: "The 14.7\" has a mirror nearly 15 inches across, bigger than the 14-inch telescopes in many public observatory domes, and it gathers about 2,800 times as much light as your eye. It looks compact because it is unusually fast, at f/2.9, so the eyepiece sits low enough to use from a chair and nobody climbs a ladder in the dark. It rides on a Poncet-style equatorial platform that tracks the sky, so the object stays in view while everyone takes a turn, and I can carry it up a flight of stairs to a deck, patio or rooftop. A 6\" telescope and binoculars to pass around come with it."
    - title: "Found by hand, so you see more."
      text: "I know where things are and aim the telescope by eye, from memory. There is no keypad, no alignment routine and no waiting on a computer, which means a lot of objects in a short time. If someone bumps the telescope, nothing is lost, and we are back on target in about 30 seconds."
    - title: "I built the telescope."
      text: "The main telescope is one I made myself, so if you are curious how it works, I can show you every part of it."
    - title: "Nobody is made to feel dumb."
      text: "No question is too basic, and I explain what you are looking at in plain language. The night is about what is in the eyepiece, not about me or what the equipment cost."
    - title: "Good with kids."
      text: "I was the kid at the eyepiece not that long ago. Kids get real views and real answers at their own pace, and nobody of any age needs to know anything beforehand."
- lead: "And the practical side:"
  items:
    - title: "Private, and priced per group."
      text: "Only your group is there. The price is for the group, not per person, the night is paced to whoever came, and I can add a short talk before viewing if you want one."
    - title: "I come to you."
      text: "Your backyard, vacation rental or resort, or a dark-sky site I pick based on where you are staying. Travel is included in the Tucson and Phoenix areas."
    - title: "It works from town."
      text: "The Moon, the planets and bright star clusters look as good from a backyard as from the desert, and night vision pulls nebulae out of a city sky."
    - title: "Planned around the sky."
      text: "Tell me your dates and I will tell you what is up, where the Moon will be, and which night and place will show it best."
    - title: "Photos to take home."
      text: "On request I'll shoot a timelapse of your night or a portrait of your group under the stars. The camera runs in the background, away from the telescope."
    - title: "A printed guide."
      text: "Every guest gets a printed guide to what was overhead that night."
    - title: "Clear skies, or we reschedule."
      text: "Arizona has some of the clearest, darkest skies in the country, so weather cancellations are rare. If clouds do show up, we reschedule at no charge."
