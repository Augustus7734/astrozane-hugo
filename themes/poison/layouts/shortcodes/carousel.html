{{ $id := .Get "id" | default (printf "carousel-%d" (now.UnixNano)) }}
<div class="zl-carousel" id="{{ $id }}">
  <div class="zl-carousel-track">
    {{ .Inner }}
  </div>
  <button class="zl-carousel-btn zl-carousel-prev" aria-label="Previous image" onclick="zlCarouselMove('{{ $id }}', -1)">&#10094;</button>
  <button class="zl-carousel-btn zl-carousel-next" aria-label="Next image" onclick="zlCarouselMove('{{ $id }}', 1)">&#10095;</button>
</div>

<style>
.zl-carousel { position: relative; margin: 1.5rem 0 2rem; }
.zl-carousel-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  gap: 1rem;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 0.5rem;
  scrollbar-width: thin;
}
.zl-carousel-slide {
  flex: 0 0 85%;
  max-width: 520px;
  scroll-snap-align: start;
}
.zl-carousel-slide img {
  width: 100%;
  border-radius: 6px;
  display: block;
}
.zl-carousel-caption { padding: 0.5rem 0.25rem 0; }
.zl-carousel-caption h4 { margin: 0 0 0.25rem; font-size: 1rem; }
.zl-carousel-caption p { margin: 0; font-size: 0.85rem; opacity: 0.75; }
.zl-carousel-btn {
  position: absolute;
  top: 38%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: none;
  width: 2.2rem;
  height: 2.2rem;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  z-index: 2;
}
.zl-carousel-prev { left: 0.5rem; }
.zl-carousel-next { right: 0.5rem; }
@media (max-width: 640px) {
  .zl-carousel-slide { flex: 0 0 92%; }
  .zl-carousel-btn { display: none; }
}
</style>

<script>
function zlCarouselMove(id, dir) {
  var track = document.querySelector('#' + id + ' .zl-carousel-track');
  var slide = track.querySelector('.zl-carousel-slide');
  var gap = 16;
  var slideWidth = slide.getBoundingClientRect().width + gap;
  track.scrollBy({ left: dir * slideWidth, behavior: 'smooth' });
}
</script>
