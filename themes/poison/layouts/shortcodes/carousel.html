{{ $id := .Get "id" | default (printf "carousel-%d" (now.UnixNano)) }}
<div class="zl-carousel" id="{{ $id }}">
  <div class="zl-carousel-viewport">
    {{ .Inner }}
  </div>
  <button class="zl-carousel-btn zl-carousel-prev" aria-label="Previous image" onclick="zlCarouselMove('{{ $id }}', -1)">&#10094;</button>
  <button class="zl-carousel-btn zl-carousel-next" aria-label="Next image" onclick="zlCarouselMove('{{ $id }}', 1)">&#10095;</button>
  <div class="zl-carousel-counter"><span class="zl-current">1</span> / <span class="zl-total"></span></div>
</div>

<style>
.zl-carousel { position: relative; margin: 1.5rem 0 2rem; }
.zl-carousel-viewport { position: relative; width: 100%; }
.zl-carousel-slide { display: none; flex-direction: column; }
.zl-carousel-slide.active { display: flex; }
.zl-carousel-imgwrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-height: 75vh;
  background: #000;
  cursor: zoom-in;
  overflow: hidden;
}
.zl-carousel-imgwrap img {
  width: 100%;
  height: 100%;
  max-height: 75vh;
  object-fit: contain;
  display: block;
}
.zl-carousel-caption { padding: 0.6rem 0.25rem 0; }
.zl-carousel-caption h4 { margin: 0 0 0.25rem; font-size: 1rem; }
.zl-carousel-caption p { margin: 0; font-size: 0.85rem; opacity: 0.75; }
.zl-carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: none;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  z-index: 2;
}
.zl-carousel-prev { left: 0.5rem; }
.zl-carousel-next { right: 0.5rem; }
.zl-carousel-counter {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 0.75rem;
  padding: 0.15rem 0.6rem;
  border-radius: 1rem;
  z-index: 2;
}
</style>

<script>
function zlCarouselInit(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var slides = el.querySelectorAll('.zl-carousel-slide');
  if (!slides.length) return;
  var hasActive = false;
  slides.forEach(function(s) { if (s.classList.contains('active')) hasActive = true; });
  if (!hasActive) slides[0].classList.add('active');
  var total = el.querySelector('.zl-total');
  if (total) total.textContent = slides.length;
}
function zlCarouselMove(id, dir) {
  var el = document.getElementById(id);
  var slides = el.querySelectorAll('.zl-carousel-slide');
  var current = 0;
  slides.forEach(function(s, i) { if (s.classList.contains('active')) current = i; });
  slides[current].classList.remove('active');
  var next = (current + dir + slides.length) % slides.length;
  slides[next].classList.add('active');
  el.querySelector('.zl-current').textContent = next + 1;
}
if (!window.__zlCarouselInited) {
  window.__zlCarouselInited = true;
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.zl-carousel').forEach(function(el) { zlCarouselInit(el.id); });
  });
  document.addEventListener('touchstart', function(e) {
    var vp = e.target.closest('.zl-carousel-viewport');
    if (vp) vp.dataset.touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    var vp = e.target.closest('.zl-carousel-viewport');
    if (!vp || vp.dataset.touchStartX === undefined) return;
    var dx = e.changedTouches[0].clientX - parseFloat(vp.dataset.touchStartX);
    if (Math.abs(dx) > 40) {
      zlCarouselMove(vp.closest('.zl-carousel').id, dx < 0 ? 1 : -1);
    }
    delete vp.dataset.touchStartX;
  }, { passive: true });
} else {
  document.querySelectorAll('.zl-carousel').forEach(function(el) { zlCarouselInit(el.id); });
}
</script>
