{{ $id := .Get "id" | default (printf "carousel-%d" (now.UnixNano)) }}
<div class="zl-carousel" id="{{ $id }}">
  <div class="zl-carousel-viewport">
    {{ .Inner }}
  </div>
  <button class="zl-carousel-btn zl-carousel-prev" aria-label="Previous image" onclick="zlCarouselMove(this.closest('.zl-carousel'), -1)">&#10094;</button>
  <button class="zl-carousel-btn zl-carousel-next" aria-label="Next image" onclick="zlCarouselMove(this.closest('.zl-carousel'), 1)">&#10095;</button>
  <div class="zl-carousel-counter"><span class="zl-current">1</span> / <span class="zl-total">1</span></div>
  <script>
  (function() {
    var root = document.currentScript.closest('.zl-carousel');
    if (!root) return;
    var slides = root.querySelectorAll('.zl-carousel-slide');
    var totalEl = root.querySelector('.zl-total');
    if (totalEl) totalEl.textContent = slides.length;
    if (slides.length) slides[0].classList.add('zl-active');
  })();
  </script>
</div>

<style>
.zl-carousel { position: relative; margin: 1.5rem 0 2rem; }
.zl-carousel-viewport { position: relative; width: 100%; }
.zl-carousel-slide { display: none; flex-direction: column; }
.zl-carousel-slide.zl-active { display: flex; }
.zl-carousel-imgwrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-height: 75vh;
  background: #000;
  cursor: zoom-in;
  overflow: hidden;
}
.zl-carousel-imgwrap img {
  width: 100%;
  height: 100%;
  max-height: 75vh;
  object-fit: contain;
  display: block;
}
.zl-carousel-caption { padding: 0.6rem 0.25rem 0; }
.zl-carousel-caption h4 { margin: 0 0 0.35rem; font-size: 1rem; }
.zl-carousel-meta { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; opacity: 0.85; }
.zl-carousel-meta li { margin: 0.15rem 0; }
.zl-carousel-meta strong { opacity: 1; }
.zl-carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: none;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  z-index: 2;
}
.zl-carousel-prev { left: 0.5rem; }
.zl-carousel-next { right: 0.5rem; }
.zl-carousel-counter {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 0.75rem;
  padding: 0.15rem 0.6rem;
  border-radius: 1rem;
  z-index: 2;
}
</style>

<script>
function zlCarouselMove(root, dir) {
  if (!root) return;
  var slides = root.querySelectorAll('.zl-carousel-slide');
  if (!slides.length) return;
  var current = 0;
  slides.forEach(function(s, i) { if (s.classList.contains('zl-active')) current = i; });
  slides[current].classList.remove('zl-active');
  var next = (current + dir + slides.length) % slides.length;
  slides[next].classList.add('zl-active');
  var counter = root.querySelector('.zl-current');
  if (counter) counter.textContent = next + 1;
}
if (!window.__zlCarouselSwipeBound) {
  window.__zlCarouselSwipeBound = true;
  document.addEventListener('touchstart', function(e) {
    var vp = e.target.closest('.zl-carousel-viewport');
    if (vp) vp.dataset.touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    var vp = e.target.closest('.zl-carousel-viewport');
    if (!vp || vp.dataset.touchStartX === undefined) return;
    var dx = e.changedTouches[0].clientX - parseFloat(vp.dataset.touchStartX);
    if (Math.abs(dx) > 40) {
      zlCarouselMove(vp.closest('.zl-carousel'), dx < 0 ? 1 : -1);
    }
    delete vp.dataset.touchStartX;
  }, { passive: true });
}
</script>
