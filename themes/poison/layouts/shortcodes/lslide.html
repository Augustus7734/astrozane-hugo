<div class="zl-carousel-slide">
  <a class="zl-carousel-imgwrap" href="{{ .Get "img" }}" target="_blank" rel="noopener">
    <img src="{{ .Get "img" }}" alt="{{ .Get "title" }}" loading="lazy">
  </a>
  <div class="zl-carousel-caption">
    <h4>{{ .Get "title" }}</h4>
    <ul class="zl-carousel-meta">
      <li><strong>Camera:</strong> {{ .Get "camera" }}</li>
      {{ with .Get "lens" }}<li><strong>Lens:</strong> {{ . }}</li>{{ end }}
      <li><strong>Location:</strong> {{ .Get "location" }}</li>
    </ul>
  </div>
</div>
